name: NoirPanther Docker image

# Builds the NoirPanther server image for amd64 + arm64 on GitHub's native runners and
# publishes it to the GitHub Container Registry:
#   ghcr.io/vint1024/noirpanther:<version>  and  :latest
#
# Triggers:
#   - pushing a tag `noirpanther-v*`  (e.g. `git tag noirpanther-v0.1.7-vint-0.5.0 && git push github --tags`)
#   - manually from the Actions tab (workflow_dispatch)
#
# Auth uses the built-in GITHUB_TOKEN (packages: write) — no secrets to manage.

on:
  push:
    tags:
      - 'noirpanther-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag. Empty = workspace version from Cargo.toml'
        required: false
        default: ''
      latest:
        description: 'Also move the :latest tag'
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: noirpanther-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/vint1024/noirpanther

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            GIT_REV=${{ github.sha }}
            BUILD_CHANNEL=stable
            CARGO_BUILD_JOBS=4
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=NoirPanther server (a fork of Stump)
            org.opencontainers.image.licenses=MIT
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=noirpanther-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=noirpanther-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch manifest
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - name: Checkout (for the version)
        uses: actions/checkout@v4

      - name: Resolve tags
        id: tags
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ] && [[ "${GITHUB_REF}" == refs/tags/noirpanther-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/noirpanther-v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          TAGS="-t ${IMAGE}:${VERSION}"
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.latest }}" = "true" ]; then
            TAGS="$TAGS -t ${IMAGE}:latest"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create ${{ steps.tags.outputs.tags }} \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.tags.outputs.version }}"
