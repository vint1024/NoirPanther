name: CVE Check

on:
  push:
    paths:
      - .github/workflows/cve_check.yml
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  yarn-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # FORK CHANGE. Upstream files a GitHub issue with the findings; this fork has issues
      # turned off, so that step failed every Monday with "the repository has disabled
      # issues" — a weekly e-mail that said nothing about the dependencies. The findings go
      # to the job log instead and the job fails on them, so the same e-mail arrives with a
      # cause worth reading. (Restore the upstream version if issues are ever enabled.)
      - name: Run yarn audit
        run: |
          # prevent non-zero exit from killing the job before we can print anything
          set +e
          AUDIT_OUTPUT=$(yarn audit --groups dependencies 2>&1)
          AUDIT_EXIT_CODE=$?
          set -e

          # yarn audit exits 0 when no vulnerabilities are found
          if [ "$AUDIT_EXIT_CODE" -ne 0 ]; then
            echo "$AUDIT_OUTPUT"
            exit 1
          fi
