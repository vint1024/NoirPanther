# NoirPanther server — the simplest setup (built-in SQLite database).
#   docker compose up -d     →  http://localhost:10801  (the first account you create becomes the owner)
# For PostgreSQL see docker-compose.postgres.yml next to this file.
services:
  noirpanther:
    image: ghcr.io/vint1024/noirpanther:latest
    container_name: noirpanther
    volumes:
      # Config dir: the SQLite database, thumbnails, avatars, logs
      - ./noirpanther_config:/config
      # Your books (read-only is enough unless you use metadata write-back)
      - /path/to/your/books:/data
    ports:
      - 10801:10801
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - STUMP_CONFIG_DIR=/config
    restart: unless-stopped
