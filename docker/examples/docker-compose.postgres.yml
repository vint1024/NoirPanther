# NoirPanther server on PostgreSQL (docker compose).
# Put the database password into a .env file next to this file:  STUMP_DB_PASSWORD=choose-a-password
#
# Migrating an existing SQLite database: start this stack once (it creates the schema), stop the
# `noirpanther` container, run scripts/db/sqlite_to_postgres.py (e.g. in a one-off python:3.12-slim
# container on this compose network), start it again.
#
# If the auto-assigned docker subnet overlaps your LAN (containers lose access to local hosts),
# pin one explicitly:
#   networks: { default: { ipam: { config: [{ subnet: 172.16.80.0/24 }] } } }
services:
  db:
    image: postgres:18-alpine
    container_name: noirpanther-db
    environment:
      POSTGRES_USER: stump
      POSTGRES_PASSWORD: ${STUMP_DB_PASSWORD}
      POSTGRES_DB: stump
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stump -d stump']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  noirpanther:
    image: ghcr.io/vint1024/noirpanther:latest
    container_name: noirpanther
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./noirpanther_config:/config # thumbnails, avatars, logs (the database lives in `db`)
      - /path/to/your/books:/data
    ports:
      - 10801:10801
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - STUMP_CONFIG_DIR=/config
      - STUMP_DB_HOST=db
      - STUMP_DB_PORT=5432
      - STUMP_DB_NAME=stump
      - STUMP_DB_USER=stump
      - STUMP_DB_PASSWORD=${STUMP_DB_PASSWORD}
    restart: unless-stopped

volumes:
  pgdata:
